<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TH Magic Force App</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
        }
        h2 { margin-bottom: 20px; color: #00adb5; }
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }
        button {
            padding: 12px;
            background: #393e46;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:active { background: #00adb5; }
        input, select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background: #2b2d42;
            color: white;
            border: 1px solid #4f5d75;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background: #222831;
            border-radius: 8px;
            font-size: 18px;
            border: 1px dashed #00adb5;
        }
        /* Hidden Magician Control Panel */
        #secret-panel {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 999;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
        }
        .secret-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .close-btn { background: #ff4c29; width: auto; padding: 5px 15px; }
        .tap-trigger {
            position: fixed;
            top: 0; left: 0; width: 50px; height: 50px;
            z-index: 998;
        }
    </style>
</head>
<body>

    <!-- ဘယ်ဘက်ထောင့်အစွန်ကို နှစ်ချက်နှိပ်ပါက Secret Panel ပွင့်ရန် -->
    <div class="tap-trigger" id="tapTrigger"></div>

    <div class="container">
        <h2>Mentalism Force App</h2>
        
        <label>အမျိုးအစား ရွေးချယ်ပါ:</label>
        <select id="categorySelect" onchange="updateMaxRange()">
            <option value="celebrity">Celebrity (1 - 100)</option>
            <option value="superhero">Superhero (1 - 15)</option>
            <option value="animal">Animal (1 - 50)</option>
            <option value="songs">Songs (1 - 100)</option>
        </select>

        <label>သင်ကြိုက်နှစ်သက်ရာ နံပါတ်ကို ထည့်ပါ:</label>
        <input type="number" id="userNumber" placeholder="နံပါတ်ထည့်ရန်..." min="1">

        <button onclick="revealResult()">ရလဒ်ကို ကြည့်မည်</button>

        <div class="result-box" id="resultDisplay">ရလဒ်သည် ဤနေရာတွင် ပေါ်လာမည်...</div>
    </div>

    <!-- Magician Control Panel -->
    <div id="secret-panel">
        <div class="secret-header">
            <h3>Magician Control Panel</h3>
            <button class="close-btn" onclick="toggleSecretPanel()">ပိတ်မည်</button>
        </div>
        <p style="font-size: 14px; color: #aaa;">ပရိသတ်မမြင်စေဘဲ Force လုပ်မည့် အဖြေများကို ဤနေရာတွင် ကြိုတင်သတ်မှတ်ပါ။</p>
        
        <label>Celebrity Force အဖြေ (1 - 100):</label>
        <input type="text" id="forceCelebrity" value="Leonardo DiCaprio">

        <label>Superhero Force အဖြေ (1 - 15):</label>
        <input type="text" id="forceSuperhero" value="Batman">

        <label>Animal Force အဖြေ (1 - 50):</label>
        <input type="text" id="forceAnimal" value="Bengal Tiger">

        <label>Songs Force အဖြေ (1 - 100):</label>
        <input type="text" id="forceSongs" value="Bohemian Rhapsody">

        <button onclick="saveSettings()" style="background: #00adb5; margin-top: 15px;">အပြောင်းအလဲများကို သိမ်းမည်</button>
    </div>

    <script>
        // Secret Panel ကို ဘယ်ဘက်ထောင့်အစွန်ပေါ် ၂ ချက်နှိပ်ခြင်းဖြင့် ဖွင့်ရန်
        let lastTap = 0;
        document.getElementById('tapTrigger').addEventListener('click', function() {
            let currentTime = new Date().getTime();
            let tapLength = currentTime - lastTap;
            if (tapLength < 500 && tapLength > 0) {
                toggleSecretPanel();
            }
            lastTap = currentTime;
        });

        function toggleSecretPanel() {
            let panel = document.getElementById('secret-panel');
            panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
        }

        function updateMaxRange() {
            let cat = document.getElementById('categorySelect').value;
            let input = document.getElementById('userNumber');
            if (cat === 'superhero') {
                input.max = 15;
            } else if (cat === 'animal') {
                input.max = 50;
            } else {
                input.max = 100;
            }
        }

        function saveSettings() {
            localStorage.setItem('force_celebrity', document.getElementById('forceCelebrity').value);
            localStorage.setItem('force_superhero', document.getElementById('forceSuperhero').value);
            localStorage.setItem('force_animal', document.getElementById('forceAnimal').value);
            localStorage.setItem('force_songs', document.getElementById('forceSongs').value);
            alert("အောင်မြင်စွာ သိမ်းဆည်းပြီးပါပြီ!");
            toggleSecretPanel();
        }

        // စတင်ချိန်တွင် သိမ်းဆည်းထားသည်များကို ပြန်ဖော်ရန်
        window.onload = function() {
            if(localStorage.getItem('force_celebrity')) document.getElementById('forceCelebrity').value = localStorage.getItem('force_celebrity');
            if(localStorage.getItem('force_superhero')) document.getElementById('forceSuperhero').value = localStorage.getItem('force_superhero');
            if(localStorage.getItem('force_animal')) document.getElementById('forceAnimal').value = localStorage.getItem('force_animal');
            if(localStorage.getItem('force_songs')) document.getElementById('forceSongs').value = localStorage.getItem('force_songs');
        }

        function revealResult() {
            let category = document.getElementById('categorySelect').value;
            let num = document.getElementById('userNumber').value;
            let display = document.getElementById('resultDisplay');

            if(!num) {
                display.innerHTML = "ကျေးဇူးပြု၍ နံပါတ်တစ်ခု ထည့်ပါ။";
                return;
            }

            let forcedResult = "";
            if(category === 'celebrity') {
                forcedResult = localStorage.getItem('force_celebrity') || "Leonardo DiCaprio";
            } else if(category === 'superhero') {
                forcedResult = localStorage.getItem('force_superhero') || "Batman";
            } else if(category === 'animal') {
                forcedResult = localStorage.getItem('force_animal') || "Bengal Tiger";
            } else if(category === 'songs') {
                forcedResult = localStorage.getItem('force_songs') || "Bohemian Rhapsody";
            }

            // ပရိသတ်ထည့်လိုက်တဲ့ နံပါတ် ဘာပဲဖြစ်နေပါစေ Control Panel မှာ သတ်မှတ်ထားတဲ့ အဖြေအတိုင်း ထွက်စေရန်
            display.innerHTML = `ရွေးချယ်ထားသော နံပါတ် (${num}) အတွက် အဖြေ: <br><strong style="color: #00adb5; font-size: 22px;">${forcedResult}</strong>`;
        }
    </script>
</body>
</html>
