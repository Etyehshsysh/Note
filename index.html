<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }
        h1 {
            font-size: 32px;
            margin: 0;
            cursor: pointer;
        }
        .back-btn {
            color: #ff9f0a;
            font-size: 17px;
            cursor: pointer;
            display: none;
            align-items: center;
        }
        .date {
            color: #8e8e93;
            font-size: 13px;
            margin-bottom: 15px;
        }
        
        /* Main Folder List */
        .notes-folder {
            background: #1c1c1e;
            border-radius: 12px;
            overflow: hidden;
        }
        .folder-item {
            padding: 16px;
            border-bottom: 1px solid #38383a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        .folder-item:last-child {
            border-bottom: none;
        }
        .folder-title {
            font-size: 18px;
            font-weight: 600;
        }
        .folder-count {
            color: #8e8e93;
            font-size: 15px;
        }

        /* Detail Items List */
        .detail-list {
            display: none;
            background: #1c1c1e;
            border-radius: 12px;
            max-height: 70vh;
            overflow-y: auto;
        }
        .list-item {
            padding: 14px 16px;
            border-bottom: 1px solid #38383a;
            font-size: 16px;
            display: flex;
        }
        .list-item:last-child {
            border-bottom: none;
        }
        .item-num {
            color: #ff9f0a;
            width: 45px;
            font-weight: bold;
        }

        /* Magician Control Panel */
        .control-panel {
            margin-top: 25px;
            background: #111;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #333;
            text-align: center;
        }
        .control-panel h3 {
            margin: 0 0 10px 0;
            color: #ff9f0a;
            font-size: 14px;
        }
        .input-group {
            margin-bottom: 12px;
            text-align: left;
        }
        .input-group label {
            display: block;
            font-size: 12px;
            color: #aaa;
            margin-bottom: 4px;
        }
        .control-panel input {
            background: #222;
            border: 1px solid #444;
            color: #fff;
            padding: 8px;
            border-radius: 6px;
            width: 100%;
            text-align: center;
            font-size: 14px;
        }
        .control-panel button {
            background: #ff9f0a;
            color: #000;
            border: none;
            padding: 10px 18px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 5px;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <span class="back-btn" id="backBtn" onclick="showFolderView()">‹ Notes</span>
            <h1 id="mainTitle">Notes</h1>
        </div>
        <div class="date" id="dateDisplay">July 26, 2026</div>

        <!-- Home View -->
        <div class="notes-folder" id="folderView">
            <div class="folder-item" onclick="openNote('celebrity')">
                <span class="folder-title">Famous Celebrities</span>
                <span class="folder-count">100 ›</span>
            </div>
            <div class="folder-item" onclick="openNote('superhero')">
                <span class="folder-title">Superheroes List</span>
                <span class="folder-count">15 ›</span>
            </div>
        </div>

        <!-- Detail View -->
        <div class="detail-list" id="detailView"></div>

        <!-- Magician Secret Setup Panel -->
        <div class="control-panel" id="secretPanel">
            <h3>Magician Control Panel</h3>
            
            <div class="input-group">
                <label>Celebrity Spectator's Number (1-100):</label>
                <input type="number" id="celebNumInput" placeholder="Enter spectator number (e.g. 58)">
            </div>

            <div class="input-group">
                <label>Superhero Spectator's Number (1-15):</label>
                <input type="number" id="heroNumInput" placeholder="Enter spectator number (e.g. 12)">
            </div>

            <button onclick="updateForceNumbers()">Apply Spectator Choice</button>
        </div>
    </div>

    <script>
        // Default Fixed Force Names (ပုံသေ အဖြေများ)
        let fixedCelebrityForce = "Leonardo DiCaprio";
        let fixedSuperheroForce = "Spider-Man";

        // Active Force Numbers (ပရိသတ်ပြောမည့် နံပါတ်များ)
        let activeCelebNumber = 23; // Default
        let activeHeroNumber = 7;   // Default

        // Sample Databases
        let baseCelebrities = [
            "Tom Cruise", "Will Smith", "Brad Pitt", "Johnny Depp", "Denzel Washington",
            "Keanu Reeves", "Robert Downey Jr.", "Scarlett Johansson", "Angelina Jolie",
            "Morgan Freeman", "Matt Damon", "Christian Bale", "Hugh Jackman", "Chris Hemsworth",
            "Chris Evans", "Mark Ruffalo", "Tom Hardy", "Ryan Reynolds", "Gal Gadot",
            "Emma Watson", "Jennifer Lawrence", "Taylor Swift", "Beyoncé", "Rihanna",
            "Justin Bieber", "Drake", "Eminem", "Kanye West", "Bruno Mars",
            "Ed Sheeran", "Ariana Grande", "Selena Gomez", "Billie Eilish", "Dwayne Johnson",
            "Vin Diesel", "Jason Statham", "Jackie Chan", "Jet Li", "Stephen Chow",
            "Shah Rukh Khan", "Salman Khan", "Aamir Khan", "BTS (Jungkook)", "IU",
            "Ji Chang-wook", "Lee Do-hyun", "Song Joong-ki", "Lee Min-ho", "G-Dragon"
        ];

        let baseSuperheroes = [
            "Iron Man", "Captain America", "Thor", "Hulk", "Black Widow",
            "Hawkeye", "Doctor Strange", "Black Panther", "Ant-Man",
            "Superman", "Batman", "Wonder Woman", "The Flash", "Aquaman", "Wolverine"
        ];

        function openNote(type) {
            document.getElementById('folderView').style.display = 'none';
            document.getElementById('detailView').style.display = 'block';
            document.getElementById('backBtn').style.display = 'flex';

            const container = document.getElementById('detailView');
            container.innerHTML = '';

            if (type === 'celebrity') {
                document.getElementById('mainTitle').innerText = "Celebrities";
                for (let i = 1; i <= 100; i++) {
                    let name = baseCelebrities[(i - 1) % baseCelebrities.length];
                    
                    // ပရိသတ် ရွေးလိုက်သော နံပါတ်နေရာ၌ Fixed Force Name ပေါ်စေခြင်း
                    if (i === parseInt(activeCelebNumber)) {
                        name = fixedCelebrityForce;
                    }
                    
                    container.innerHTML += `<div class="list-item"><span class="item-num">${i}.</span><span>${name}</span></div>`;
                }
            } else if (type === 'superhero') {
                document.getElementById('mainTitle').innerText = "Superheroes";
                for (let i = 1; i <= 15; i++) {
                    let name = baseSuperheroes[(i - 1) % baseSuperheroes.length];
                    
                    // ပရိသတ် ရွေးလိုက်သော နံပါတ်နေရာ၌ Fixed Force Name ပေါ်စေခြင်း
                    if (i === parseInt(activeHeroNumber)) {
                        name = fixedSuperheroForce;
                    }
                    
                    container.innerHTML += `<div class="list-item"><span class="item-num">${i}.</span><span>${name}</span></div>`;
                }
            }
        }

        function showFolderView() {
            document.getElementById('folderView').style.display = 'block';
            document.getElementById('detailView').style.display = 'none';
            document.getElementById('backBtn').style.display = 'none';
            document.getElementById('mainTitle').innerText = "Notes";
        }

        function updateForceNumbers() {
            let cNum = document.getElementById('celebNumInput').value;
            let hNum = document.getElementById('heroNumInput').value;

            if (cNum) activeCelebNumber = parseInt(cNum);
            if (hNum) activeHeroNumber = parseInt(hNum);

            // Secret Panel ကို ပုန်းအုပ်လိုက်ခြင်း
            document.getElementById('secretPanel').style.display = 'none';
            alert("Updated! Spectator's number is now active.");
        }

        // Title ကို ၃ ခါ နှိပ်လျှင် Control Panel ပုန်း/ပေါ် ပြုလုပ်ခြင်း
        let titleTap = 0;
        document.getElementById('mainTitle').addEventListener('click', () => {
            titleTap++;
            if (titleTap === 3) {
                let p = document.getElementById('secretPanel');
                p.style.display = p.style.display === 'none' ? 'block' : 'none';
                titleTap = 0;
            }
        });
    </script>
</body>
</html>
