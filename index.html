<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Notes</title>
    <style>
        body {
            background-color: #1e1e1e;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .note-container {
            width: 100%;
            max-width: 450px;
            background: #2d2d2d;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }
        /* Secret Trigger Area (Notes Title) */
        .note-title {
            font-size: 20px;
            font-weight: bold;
            color: #ffffff;
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
            margin-bottom: 15px;
            cursor: pointer;
            user-select: none;
        }
        .section-box {
            background: #383838;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        .section-title {
            font-size: 14px;
            color: #b0b0b0;
            margin-bottom: 6px;
            font-weight: bold;
        }
        .input-row {
            display: flex;
            gap: 8px;
        }
        input, select {
            flex: 1;
            padding: 10px;
            background: #222;
            color: white;
            border: 1px solid #555;
            border-radius: 6px;
            font-size: 15px;
            box-sizing: border-box;
        }
        button {
            padding: 10px 15px;
            background: #007acc;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
        }
        button:active { background: #005999; }
        .output-text {
            margin-top: 8px;
            font-size: 16px;
            color: #4cd137;
            font-weight: bold;
        }

        /* Magician Secret Control Panel */
        #secretPanel {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 15, 15, 0.98);
            z-index: 999;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
        }
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }
        .close-btn { background: #e84118; }
        .panel-group {
            margin-bottom: 15px;
        }
        .panel-group label {
            display: block;
            font-size: 13px;
            color: #aaa;
            margin-bottom: 5px;
        }
        .panel-group input {
            width: 100%;
            padding: 10px;
            background: #222;
            color: white;
            border: 1px solid #444;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <div class="note-container">
        <!-- ပရိသတ်မမြင်အောင် ဒီခေါင်းစဉ်စာသားကို ၂ ချက်ဆက်တိုက် (Double Tap) နှိပ်ပါက Control Panel ပွင့်ပါမည် -->
        <div class="note-title" id="secretTrigger">My Magic Predictions 📝</div>

        <!-- Celebrity Section -->
        <div class="section-box">
            <div class="section-title">Celebrity (1 - 100)</div>
            <div class="input-row">
                <input type="number" id="numCeleb" placeholder="နံပါတ်ထည့်ရန်" min="1" max="100">
                <button onclick="reveal('celeb')">စစ်ဆေးရန်</button>
            </div>
            <div class="output-text" id="resCeleb"></div>
        </div>

        <!-- Superhero Section -->
        <div class="section-box">
            <div class="section-title">Superhero (1 - 15)</div>
            <div class="input-row">
                <input type="number" id="numSuper" placeholder="နံပါတ်ထည့်ရန်" min="1" max="15">
                <button onclick="reveal('super')">စစ်ဆေးရန်</button>
            </div>
            <div class="output-text" id="resSuper"></div>
        </div>

        <!-- Animal Section -->
        <div class="section-box">
            <div class="section-title">Animal (1 - 50)</div>
            <div class="input-row">
                <input type="number" id="numAnimal" placeholder="နံပါတ်ထည့်ရန်" min="1" max="50">
                <button onclick="reveal('animal')">စစ်ဆေးရန်</button>
            </div>
            <div class="output-text" id="resAnimal"></div>
        </div>

        <!-- Songs Section -->
        <div class="section-box">
            <div class="section-title">Songs (1 - 100)</div>
            <div class="input-row">
                <input type="number" id="numSong" placeholder="နံပါတ်ထည့်ရန်" min="1" max="100">
                <button onclick="reveal('song')">စစ်ဆေးရန်</button>
            </div>
            <div class="output-text" id="resSong"></div>
        </div>
    </div>

    <!-- Magician Control Panel (Hidden) -->
    <div id="secretPanel">
        <div class="panel-header">
            <h3>Magician Control Panel</h3>
            <button class="close-btn" onclick="togglePanel()">ပိတ်မည်</button>
        </div>

        <div class="panel-group">
            <label>Celebrity Force အဖြေ:</label>
            <input type="text" id="valCeleb" value="Leonardo DiCaprio">
        </div>

        <div class="panel-group">
            <label>Superhero Force အဖြေ:</label>
            <input type="text" id="valSuper" value="Batman">
        </div>

        <div class="panel-group">
            <label>Animal Force အဖြေ:</label>
            <input type="text" id="valAnimal" value="Bengal Tiger">
        </div>

        <div class="panel-group">
            <label>Songs Force အဖြေ:</label>
            <input type="text" id="valSong" value="Bohemian Rhapsody">
        </div>

        <button onclick="saveSettings()" style="width: 100%; background: #4cd137; color: black; font-weight: bold; margin-top: 10px;">သိမ်းဆည်းမည်</button>
    </div>

    <script>
        // Double Tap Trigger for Secret Panel
        let lastTap = 0;
        document.getElementById('secretTrigger').addEventListener('click', function() {
            let currentTime = new Date().getTime();
            let tapLength = currentTime - lastTap;
            if (tapLength < 500 && tapLength > 0) {
                togglePanel();
            }
            lastTap = currentTime;
        });

        function togglePanel() {
            let panel = document.getElementById('secretPanel');
            panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
        }

        function saveSettings() {
            localStorage.setItem('f_celeb', document.getElementById('valCeleb').value);
            localStorage.setItem('f_super', document.getElementById('valSuper').value);
            localStorage.setItem('f_animal', document.getElementById('valAnimal').value);
            localStorage.setItem('f_song', document.getElementById('valSong').value);
            alert("သိမ်းဆည်းပြီးပါပြီ!");
            togglePanel();
        }

        // Load saved settings on startup
        window.onload = function() {
            if(localStorage.getItem('f_celeb')) document.getElementById('valCeleb').value = localStorage.getItem('f_celeb');
            if(localStorage.getItem('f_super')) document.getElementById('valSuper').value = localStorage.getItem('f_super');
            if(localStorage.getItem('f_animal')) document.getElementById('valAnimal').value = localStorage.getItem('f_animal');
            if(localStorage.getItem('f_song')) document.getElementById('valSong').value = localStorage.getItem('f_song');
        }

        function reveal(type) {
            let val = "", numId = "", resId = "";
            
            if(type === 'celeb') {
                val = localStorage.getItem('f_celeb') || document.getElementById('valCeleb').value;
                numId = document.getElementById('numCeleb').value;
                resId = document.getElementById('resCeleb');
            } else if(type === 'super') {
                val = localStorage.getItem('f_super') || document.getElementById('valSuper').value;
                numId = document.getElementById('numSuper').value;
                resId = document.getElementById('resSuper');
            } else if(type === 'animal') {
                val = localStorage.getItem('f_animal') || document.getElementById('valAnimal').value;
                numId = document.getElementById('numAnimal').value;
                resId = document.getElementById('resAnimal');
            } else if(type === 'song') {
                val = localStorage.getItem('f_song') || document.getElementById('valSong').value;
                numId = document.getElementById('numSong').value;
                resId = document.getElementById('resSong');
            }

            if(!numId) {
                resId.innerHTML = "ကျေးဇူးပြု၍ နံပါတ်ထည့်ပါ";
                return;
            }

            // ပရိသတ်ဘယ်နံပါတ်ပဲထည့်ထည့် Control Panel က အဖြေကိုသာ အတိအကျပြသမည်
            resId.innerHTML = `➔ အဖြေ: ${val}`;
        }
    </script>
</body>
    </html>
