<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Android Calculator Layout */
        .calculator {
            width: 100%;
            max-width: 380px;
            background-color: #1e1e1e;
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .display-container {
            background-color: #121212;
            border-radius: 16px;
            padding: 20px;
            text-align: right;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .previous-operand {
            color: #8c8c8c;
            font-size: 18px;
            min-height: 24px;
            word-break: break-all;
        }

        .current-operand {
            color: #ffffff;
            font-size: 40px;
            font-weight: 400;
            word-break: break-all;
        }

        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .btn {
            background-color: #2d2d2d;
            border: none;
            border-radius: 50%;
            width: 65px;
            height: 65px;
            font-size: 22px;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            transition: background 0.2s;
        }

        .btn:active {
            background-color: #444;
        }

        .btn-operator {
            background-color: #3b2d1d;
            color: #ffb74d;
        }

        .btn-action {
            background-color: #2c3830;
            color: #81c784;
        }

        .btn-equals {
            background-color: #ffb74d;
            color: #121212;
        }

        /* Magician Control Panel Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background-color: #1e1e1e;
            border: 2px solid #ffb74d;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            padding: 22px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-title {
            color: #ffb74d;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 4px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .input-label {
            font-size: 12px;
            color: #b0b0b0;
        }

        .modal-input {
            background-color: #2d2d2d;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 10px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }

        .modal-input:focus {
            border-color: #ffb74d;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 6px;
        }

        .modal-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-apply {
            background-color: #ffb74d;
            color: #121212;
        }

        .btn-close {
            background-color: #2d2d2d;
            color: #fff;
        }

        /* Secret Touch Trigger (ညာဘက်အောက်ထောင့်) */
        #secretTrigger {
            position: fixed;
            bottom: 0;
            right: 0;
            width: 50px;
            height: 50px;
            z-index: 999;
        }
    </style>
</head>
<body>

    <!-- Android Calculator UI -->
    <div class="calculator">
        <div class="display-container" id="displayArea">
            <div class="previous-operand" id="previousOperand"></div>
            <div class="current-operand" id="currentOperand">0</div>
        </div>

        <div class="buttons-grid">
            <button class="btn btn-action" onclick="clearAll()">AC</button>
            <button class="btn btn-action" onclick="deleteDigit()">⌫</button>
            <button class="btn btn-action" onclick="appendNumber('%')">%</button>
            <button class="btn btn-operator" onclick="appendNumber('/')">÷</button>

            <button class="btn" onclick="appendNumber('7')">7</button>
            <button class="btn" onclick="appendNumber('8')">8</button>
            <button class="btn" onclick="appendNumber('9')">9</button>
            <button class="btn btn-operator" onclick="appendNumber('*')">×</button>

            <button class="btn" onclick="appendNumber('4')">4</button>
            <button class="btn" onclick="appendNumber('5')">5</button>
            <button class="btn" onclick="appendNumber('6')">6</button>
            <button class="btn btn-operator" onclick="appendNumber('-')">-</button>

            <button class="btn" onclick="appendNumber('1')">1</button>
            <button class="btn" onclick="appendNumber('2')">2</button>
            <button class="btn" onclick="appendNumber('3')">3</button>
            <button class="btn btn-operator" onclick="appendNumber('+')">+</button>

            <button class="btn" onclick="appendNumber('0')">0</button>
            <button class="btn" onclick="appendNumber('00')">00</button>
            <button class="btn" onclick="appendNumber('.')">.</button>
            <button class="btn btn-equals" onclick="compute()">=</button>
        </div>
    </div>

    <!-- Secret Touch Area to open Panel -->
    <div id="secretTrigger" onclick="handleSecretTap()"></div>

    <!-- Magician Control Panel Modal -->
    <div class="modal-overlay" id="controlPanel">
        <div class="modal-content">
            <div class="modal-title">Magician Control Panel</div>
            
            <div class="input-group">
                <span class="input-label">Celebrity Target Number (1-100):</span>
                <input type="text" class="modal-input" id="force1" placeholder="Enter Celebrity Target">
            </div>

            <div class="input-group">
                <span class="input-label">Superhero Target Number (1-15):</span>
                <input type="text" class="modal-input" id="force2" placeholder="Enter Superhero Target">
            </div>

            <div class="input-group">
                <span class="input-label">Animal Target Number (1-50):</span>
                <input type="text" class="modal-input" id="force3" placeholder="Enter Animal Target">
            </div>

            <div class="input-group">
                <span class="input-label">Songs Target Number (1-100):</span>
                <input type="text" class="modal-input" id="force4" placeholder="Enter Songs Target">
            </div>

            <div class="modal-buttons">
                <button class="modal-btn btn-apply" onclick="applyChoices()">Apply Choice</button>
                <button class="modal-btn btn-close" onclick="closePanel()">Close</button>
            </div>
        </div>
    </div>

    <script>
        let currentOperand = '0';
        let previousOperand = '';
        let operation = undefined;
        let activeForce = null; // ရွေးချယ်ထားသော Force ကို သီးသန့်သိမ်းရန်

        // Secret Double Tap Logic (ညာဘက်အောက်ထောင့်ကို 2 ချက်နှိပ်ရန်)
        let tapCount = 0;
        let tapTimer = null;

        function handleSecretTap() {
            tapCount++;
            if (tapCount === 1) {
                tapTimer = setTimeout(() => { tapCount = 0; }, 400);
            } else if (tapCount === 2) {
                clearTimeout(tapTimer);
                tapCount = 0;
                document.getElementById('controlPanel').style.display = 'flex';
            }
        }

        function closePanel() {
            document.getElementById('controlPanel').style.display = 'none';
        }

        function applyChoices() {
            let f1 = document.getElementById('force1').value.trim();
            let f2 = document.getElementById('force2').value.trim();
            let f3 = document.getElementById('force3').value.trim();
            let f4 = document.getElementById('force4').value.trim();
            
            // ဖြည့်ထားသည့်အကွက်အပေါ်မူတည်၍ active force ကို သတ်မှတ်မည် (အများဆုံးဖြည့်ထားသည်ကို ဦးစားပေးမည် သို့မဟုတ် ဖြည့်ထားသည်ကို ယူမည်)
            if (f4 !== "") activeForce = f4;
            else if (f3 !== "") activeForce = f3;
            else if (f2 !== "") activeForce = f2;
            else if (f1 !== "") activeForce = f1;
            else activeForce = null;

            closePanel();
        }

        function updateDisplay() {
            document.getElementById('currentOperand').innerText = currentOperand;
            document.getElementById('previousOperand').innerText = previousOperand;
        }

        function appendNumber(number) {
            if (currentOperand === '0' && number !== '.') {
                currentOperand = number;
            } else {
                currentOperand += number;
            }
            updateDisplay();
        }

        function clearAll() {
            currentOperand = '0';
            previousOperand = '';
            operation = undefined;
            updateDisplay();
        }

        function deleteDigit() {
            if (currentOperand.length === 1) {
                currentOperand = '0';
            } else {
                currentOperand = currentOperand.slice(0, -1);
            }
            updateDisplay();
        }

        function compute() {
            // အကယ်၍ Control Panel ထဲတွင် Force ထည့်ထားပါက "=" နှိပ်တိုင်း ထိုအဖြေ တိတိကျကျ ပေါ်မည်
            if (activeForce !== null) {
                previousOperand = currentOperand + ' =';
                currentOperand = activeForce;
                updateDisplay();
                return;
            }

            try {
                let computation;
                let sanitized = currentOperand.replace(/×/g, '*').replace(/÷/g, '/');
                computation = eval(sanitized);
                previousOperand = currentOperand + ' =';
                currentOperand = computation.toString();
            } catch (e) {
                currentOperand = 'Error';
            }
            updateDisplay();
        }
    </script>
</body>
</html>
